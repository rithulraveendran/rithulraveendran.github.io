name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  # Triggers automatically when telemetry updates finish without needing custom tokens
  workflow_run:
    workflows: ["Update Telemetry Statistics"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Only run on push, manual dispatch, or successful telemetry updates
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup GitHub Pages Configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Static Site
        env:
          # Derive base path automatically from repository name or user root
          VITE_BASE_PATH: ${{ steps.pages.base_path || '/' }}
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
